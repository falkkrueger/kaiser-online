<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KAISER Online</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --c64-black:#000;--c64-white:#fff;--c64-red:#883338;--c64-cyan:#75CEC8;
  --c64-purple:#8E3C97;--c64-green:#56AC4D;--c64-blue:#2E2C9B;
  --c64-yellow:#EDF171;--c64-orange:#8E4229;--c64-brown:#553800;
  --c64-light-red:#C46C71;--c64-dark-grey:#4A4A4A;--c64-grey:#808080;
  --c64-light-green:#AAD652;--c64-light-blue:#6C7EEB;--c64-light-grey:#D0D0D0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Press Start 2P',monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}

.c64-border{
  background:var(--c64-light-blue);
  padding:3vmin;border-radius:4px;flex-shrink:1;
  display:flex;flex-direction:column;
  max-width:100vw;max-height:100vh;
}
.c64-screen{
  background:var(--c64-blue);position:relative;overflow:hidden;
  image-rendering:pixelated;
  width:min(96vw,calc((90vh - 80px) * 1.6));
  aspect-ratio:40/25;
  display:flex;flex-direction:column;
  cursor:pointer;
}
.c64-grid{
  display:grid;grid-template-columns:repeat(40,1fr);grid-template-rows:repeat(25,1fr);
  width:100%;height:100%;flex:1;
}
.c64-char{
  display:flex;align-items:center;justify-content:center;
  font-size:calc(min(2.2vw,1.7vh));line-height:1;
  color:var(--c64-light-blue);background:var(--c64-blue);
  user-select:none;-webkit-user-select:none;
  font-family:'Press Start 2P',monospace;white-space:nowrap;overflow:hidden;
}
.bg-black{background:#000!important}.bg-white{background:#fff!important}
.bg-red{background:#883338!important}.bg-cyan{background:#75CEC8!important}
.bg-purple{background:#8E3C97!important}.bg-green{background:#56AC4D!important}
.bg-blue{background:#2E2C9B!important}.bg-yellow{background:#EDF171!important}
.bg-orange{background:#8E4229!important}.bg-brown{background:#553800!important}
.bg-light-red{background:#C46C71!important}.bg-dark-grey{background:#4A4A4A!important}
.bg-grey{background:#808080!important}.bg-light-green{background:#AAD652!important}
.bg-light-blue{background:#6C7EEB!important}.bg-light-grey{background:#D0D0D0!important}
.fg-black{color:#000!important}.fg-white{color:#fff!important}
.fg-red{color:#883338!important}.fg-cyan{color:#75CEC8!important}
.fg-purple{color:#8E3C97!important}.fg-green{color:#56AC4D!important}
.fg-blue{color:#2E2C9B!important}.fg-yellow{color:#EDF171!important}
.fg-orange{color:#8E4229!important}.fg-brown{color:#553800!important}
.fg-light-red{color:#C46C71!important}.fg-dark-grey{color:#4A4A4A!important}
.fg-grey{color:#808080!important}.fg-light-green{color:#AAD652!important}
.fg-light-blue{color:#6C7EEB!important}.fg-light-grey{color:#D0D0D0!important}

.c64-info{color:var(--c64-light-grey);font-size:calc(min(1.0vw,0.9vh));
  text-align:center;margin-top:6px;font-family:'Press Start 2P',monospace;padding:4px}

/* Modal overlay for input */
.c64-modal{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;
  z-index:10;
}
.c64-modal-inner{
  background:var(--c64-blue);border:2px solid var(--c64-light-blue);
  padding:20px;border-radius:4px;max-width:90%;
}
.c64-modal-inner input{
  font-family:'Press Start 2P',monospace;font-size:12px;
  padding:8px;margin:8px 0;width:100%;background:#000;color:var(--c64-light-green);
  border:1px solid var(--c64-light-blue);text-transform:uppercase;letter-spacing:2px;
}
.c64-modal-inner button{
  font-family:'Press Start 2P',monospace;font-size:10px;
  background:var(--c64-light-blue);color:var(--c64-blue);
  border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin:4px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.c64-modal-inner button:active{background:var(--c64-white)}
.c64-modal-title{color:var(--c64-yellow);font-size:10px;margin-bottom:10px;text-align:center}
.c64-modal-label{color:var(--c64-cyan);font-size:8px;margin-top:8px}

/* Number input pad */
.c64-keypad{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0;
}
.c64-keypad button{
  font-family:'Press Start 2P',monospace;font-size:10px;
  background:var(--c64-dark-grey);color:var(--c64-light-green);
  border:1px solid var(--c64-light-blue);padding:10px 4px;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.c64-keypad button:active{background:var(--c64-light-blue);color:var(--c64-blue)}
.c64-keypad-wide{grid-column:span 2}

.c64-nav{display:flex;gap:8px;justify-content:center;margin-top:6px}
.c64-nav button{
  font-family:'Press Start 2P',monospace;font-size:calc(min(1.2vw,1vh));
  background:var(--c64-light-blue);color:var(--c64-blue);border:none;
  padding:8px 16px;border-radius:4px;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.c64-nav button:active{background:var(--c64-white)}
.c64-nav button:disabled{background:var(--c64-dark-grey);color:var(--c64-grey)}

@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.c64-cursor{animation:blink 1s steps(1) infinite}
</style>
</head>
<body>

<div class="c64-border">
  <div class="c64-screen" id="screen">
    <div class="c64-grid" id="grid"></div>
    <div class="c64-modal" id="modal" style="display:none">
      <div class="c64-modal-inner" id="modalContent"></div>
    </div>
  </div>
  <div class="c64-info" id="info">KAISER ONLINE - VERBINDEN...</div>
  <div class="c64-nav" id="nav"></div>
</div>

<script>
(function(){
'use strict';

// === Configuration ===
// Backend URL - auto-detect or use environment
var API = '';
// If running on GitHub Pages or locally, use the Cloudflare Tunnel backend
if (location.hostname === 'falkkrueger.github.io' || location.protocol === 'file:') {
  API = window.KAISER_API_URL || 'https://ultimately-board-alto-journalists.trycloudflare.com';
}
var COLS=40, ROWS=25;
var grid=document.getElementById('grid');
var infoEl=document.getElementById('info');
var navEl=document.getElementById('nav');
var modalEl=document.getElementById('modal');
var modalContent=document.getElementById('modalContent');
var screenEl=document.getElementById('screen');

// === State ===
var cells=[];
var state = {
  spiel_id: null,
  spiel_code: null,
  mein_name: null,
  spielstand: null,
  ws: null,
  phase: 'login', // login, lobby, playing, waiting
  bildStep: 0,
  isHost: false,
  modalCallback: null,
  eingabe_wert: '',
  eingabe_max: 999999,
};

// === Auto-join from URL ?code= ===
var urlParams = new URLSearchParams(location.search);
var preCode = urlParams.get('code');
if(preCode){
  state.preFillCode = preCode.toUpperCase();
}

// === Build grid ===
for(var r=0;r<ROWS;r++){
  cells[r]=[];
  for(var c=0;c<COLS;c++){
    var el=document.createElement('div');
    el.className='c64-char fg-light-blue bg-blue';
    el.textContent=' ';
    grid.appendChild(el);
    cells[r][c]=el;
  }
}

// === Screen rendering helpers ===
function poke(col,row,ch,fg,bg){
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  fg=fg||'light-blue';bg=bg||'blue';
  var el=cells[row][col];
  el.textContent=ch;el.className='c64-char fg-'+fg+' bg-'+bg;
}
function print(col,row,text,fg,bg){
  for(var i=0;i<text.length&&col+i<COLS;i++)poke(col+i,row,text[i],fg,bg);
}
function printCenter(row,text,fg,bg){
  var col=Math.floor((COLS-text.length)/2);if(col<0)col=0;
  print(col,row,text,fg,bg);
}
function clearScreen(bg){
  bg=bg||'blue';
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)poke(c,r,' ','light-blue',bg);
}
function hLine(col,row,len,ch,fg,bg){ch=ch||'-';
  for(var i=0;i<len&&col+i<COLS;i++)poke(col+i,row,ch,fg,bg);}
function box(col,row,w,h,fg,bg){fg=fg||'light-blue';bg=bg||'blue';
  hLine(col,row,w,'-',fg,bg);hLine(col,row+h-1,w,'-',fg,bg);
  for(var r=row+1;r<row+h-1;r++){poke(col,r,'|',fg,bg);poke(col+w-1,r,'|',fg,bg);}
  poke(col,row,'+',fg,bg);poke(col+w-1,row,'+',fg,bg);
  poke(col,row+h-1,'+',fg,bg);poke(col+w-1,row+h-1,'+',fg,bg);}
function fillRect(col,row,w,h,ch,fg,bg){ch=ch||' ';
  for(var r=row;r<row+h&&r<ROWS;r++)for(var c=col;c<col+w&&c<COLS;c++)poke(c,r,ch,fg,bg);}

function fmtNum(n){
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}

// === Modal helpers ===
function showModal(html){
  modalContent.innerHTML = html;
  modalEl.style.display = 'flex';
}
function hideModal(){ modalEl.style.display = 'none'; }

// === API calls ===
function apiCall(path, method, body){
  method = method || 'GET';
  var opts = {method:method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  return fetch(API+path, opts).then(function(r){return r.json()});
}

// === WebSocket ===
function connectWS(){
  if(state.ws){ try{state.ws.close();}catch(e){} }
  try {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    state.ws = new WebSocket(proto+'//'+location.host+'/ws/'+state.spiel_id);
    state.ws.onmessage = function(ev){
      try {
        var msg = JSON.parse(ev.data);
        if(msg.type === 'spielstand'){
          state.spielstand = msg.data;
          render();
        }
      } catch(e){}
    };
    state.ws.onclose = function(){
      // Silent - don't break the UI if WS fails
    };
    state.ws.onerror = function(){
      // Silent - UI still works via REST
    };
  } catch(e){
    // WS not available - UI works via REST only
  }
}

// === Login Screen ===
function showLogin(){
  clearScreen('black');
  printCenter(4,'KAISER','yellow','black');
  printCenter(6,'(C) 1984 ARIOLASOFT','light-red','black');
  printCenter(10,'ONLINE MULTIPLAYER','cyan','black');
  printCenter(20,'TAPPE EINE OPTION','yellow','black');
  
  navEl.innerHTML = '<button id="btnNew" style="font-size:calc(min(1.6vw,1.4vh));padding:12px 24px">NEUES SPIEL</button><button id="btnJoin" style="font-size:calc(min(1.6vw,1.4vh));padding:12px 24px">SPIEL BEITRETEN</button>';
  document.getElementById('btnNew').addEventListener('click', startNewGame);
  document.getElementById('btnJoin').addEventListener('click', joinGame);
}

function startNewGame(){
  // Nur Ersteller-Daten abfragen
  showModal(
    '<div class="c64-modal-title">NEUES SPIEL</div>'+
    '<div class="c64-modal-label">DEIN NAME:</div>'+
    '<input type="text" id="inpName" maxlength="10" placeholder="Name" autofocus>'+
    '<div class="c64-modal-label">GESCHLECHT (M/W):</div>'+
    '<div style="display:flex;gap:8px">'+
    '<button id="gM" style="flex:1">M</button><button id="gW" style="flex:1">W</button>'+
    '</div>'+
    '<div class="c64-modal-label">STAAT:</div>'+
    '<select id="inpStaat" style="font-family:monospace;font-size:10px;width:100%;padding:6px">'+
    '<option>Preussen</option><option>Bayern</option><option>Hessen</option><option>Boehmen</option><option>Sachsen</option><option>Wuerttemberg</option><option>Hannover</option><option>Pfalz</option><option>Braunschweig</option>'+
    '</select>'+
    '<div style="text-align:center;margin-top:12px">'+
    '<button id="btnCreate">SPIEL ERSTELLEN</button>'+
    '<button id="btnCancel">ABBRECHEN</button>'+
    '</div>'
  );
  
  var geschlecht = 'M';
  document.getElementById('gM').addEventListener('click', function(){geschlecht='M'; this.style.background='var(--c64-light-blue)'; document.getElementById('gW').style.background='var(--c64-dark-grey)'});
  document.getElementById('gW').addEventListener('click', function(){geschlecht='W'; this.style.background='var(--c64-light-blue)'; document.getElementById('gM').style.background='var(--c64-dark-grey)'});
  document.getElementById('gM').style.background = 'var(--c64-light-blue)';
  
  document.getElementById('btnCreate').addEventListener('click', function(){
    var name = document.getElementById('inpName').value.trim();
    var staat = document.getElementById('inpStaat').value;
    if(!name){ return; }
    
    apiCall('/api/spiel/erstellen','POST',{name:name, geschlecht:geschlecht, staat:staat}).then(function(res){
      state.spiel_id = res.spiel_id;
      state.spiel_code = res.spiel_code;
      state.spielstand = res.spielstand;
      state.mein_name = name;
      state.phase = 'lobby';
      state.isHost = true;
      hideModal();
      connectWS();
      showLobby();
    });
  });
  document.getElementById('btnCancel').addEventListener('click', hideModal);
}

function joinGame(){
  showModal(
    '<div class="c64-modal-title">SPIEL BEITRETEN</div>'+
    '<div class="c64-modal-label">SPIELCODE (6 ZEICHEN):</div>'+
    '<input type="text" id="inpCode" maxlength="6" style="text-transform:uppercase;letter-spacing:4px" placeholder="ABC123" autofocus value="'+(state.preFillCode||'')+'">'+
    '<div class="c64-modal-label">DEIN NAME:</div>'+
    '<input type="text" id="inpName" maxlength="10" placeholder="Name">'+
    '<div class="c64-modal-label">GESCHLECHT:</div>'+
    '<div style="display:flex;gap:8px">'+
    '<button id="gM2" style="flex:1">M</button><button id="gW2" style="flex:1">W</button>'+
    '</div>'+
    '<div style="text-align:center;margin-top:12px">'+
    '<button id="btnJoin2">BEITRETEN</button>'+
    '<button id="btnCancel2">ABBRECHEN</button>'+
    '</div>'
  );
  
  var geschlecht = 'M';
  document.getElementById('gM2').addEventListener('click', function(){geschlecht='M'; this.style.background='var(--c64-light-blue)'; document.getElementById('gW2').style.background='var(--c64-dark-grey)'});
  document.getElementById('gW2').addEventListener('click', function(){geschlecht='W'; this.style.background='var(--c64-light-blue)'; document.getElementById('gM2').style.background='var(--c64-dark-grey)'});
  document.getElementById('gM2').style.background = 'var(--c64-light-blue)';
  
  document.getElementById('btnJoin2').addEventListener('click', function(){
    var code = document.getElementById('inpCode').value.toUpperCase();
    var name = document.getElementById('inpName').value.trim();
    if(!code || code.length < 6 || !name){ return; }
    
    apiCall('/api/spiel/code/'+code).then(function(res){
      var sid = res.spiel_id;
      return apiCall('/api/spiel/'+sid+'/beitreten','POST',{name:name, geschlecht:geschlecht}).then(function(r){
        state.spiel_id = sid;
        state.spiel_code = code;
        state.spielstand = r.spielstand;
        state.mein_name = name;
        state.phase = 'lobby';
        state.isHost = false;
        hideModal();
        connectWS();
        showLobby();
      });
    }).catch(function(e){
      showModal('<div class="c64-modal-title">FEHLER</div><div style="color:var(--c64-light-red);font-size:8px">SPIEL NICHT GEFUNDEN ODER VOLL</div><button onclick="hideModal()">OK</button>');
    });
  });
  document.getElementById('btnCancel2').addEventListener('click', hideModal);
}

// === LOBBY ===
function showLobby(){
  var sp = state.spielstand;
  if(!sp){ showLogin(); return; }
  
  clearScreen('blue');
  printCenter(0,'KAISER LOBBY','yellow','blue');
  hLine(0,1,40,'=','white','blue');
  
  print(2,3,'SPIELCODE:','white','blue');
  print(15,3,state.spiel_code,'light-green','blue');
  
  print(2,5,'EINLADUNG:','white','blue');
  print(2,6,'falkkrueger.github.io','cyan','blue');
  print(2,7,'/kaiser-online/?code=','cyan','blue');
  print(2,8,state.spiel_code,'light-green','blue');
  
  print(2,10,'SPIELER:','yellow','blue');
  for(var i=0;i<sp.spieler.length && i<12;i++){
    var s = sp.spieler[i];
    print(2,11+i,(i+1)+'. '+s.name+' ('+s.staat+')','white','blue');
  }
  
  printCenter(24,sp.spieler.length+' SPIELER','light-green','blue');
  
  infoEl.textContent = 'LOBBY - Code: '+state.spiel_code;
  
  if(state.isHost){
    navEl.innerHTML = '<button id="btnStart" style="background:var(--c64-green);font-size:calc(min(1.6vw,1.4vh));padding:12px 24px">SPIEL STARTEN</button><button id="btnLink" style="font-size:calc(min(1.4vw,1.2vh));padding:12px 16px">LINK KOPIEREN</button>';
    document.getElementById('btnStart').addEventListener('click', function(){
      apiCall('/api/spiel/'+state.spiel_id+'/starten','POST',{}).then(function(res){
        state.spielstand = res.spielstand;
        state.phase = 'playing';
        render();
      });
    });
    document.getElementById('btnLink').addEventListener('click', function(){
      var link = 'https://falkkrueger.github.io/kaiser-online/?code='+state.spiel_code;
      if(navigator.share){
        navigator.share({title:'Kaiser Online', text:'Komm Kaiser spielen! Code: '+state.spiel_code, url:link});
      } else {
        navigator.clipboard.writeText(link);
        infoEl.textContent = 'LINK KOPIERT: '+link;
      }
    });
  } else {
    navEl.innerHTML = '<button disabled style="opacity:0.5">WARTE AUF START...</button>';
  }
}

// === Game Action ===
function doAktion(aktion, parameter){
  return apiCall('/api/spiel/'+state.spiel_id+'/aktion','POST',{aktion:aktion, parameter:parameter||{}})
    .then(function(res){
      // After action, refresh full state via REST (in case WS doesn't work)
      return apiCall('/api/spiel/'+state.spiel_id).then(function(stand){
        state.spielstand = stand;
        return res;
      }).catch(function(){ return res; });
    });
}

// === Number input modal ===
function numberInput(title, max, callback){
  state.eingabe_wert = '';
  state.eingabe_max = max || 999999;
  showModal(
    '<div class="c64-modal-title">'+title+'</div>'+
    '<div style="text-align:center;font-size:16px;color:var(--c64-light-green);margin:10px 0" id="numDisplay">0</div>'+
    '<div class="c64-keypad">'+
    '<button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button><button data-d="C">C</button><button data-d="back">&lt;</button>'+
    '<button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button><button data-d="0">0</button><button data-d="ok" class="c64-keypad-wide" style="grid-row:span 2">OK</button>'+
    '<button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button><button data-d="00">00</button>'+
    '</div>'
  );
  var disp = document.getElementById('numDisplay');
  modalContent.querySelectorAll('.c64-keypad button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var d = this.getAttribute('data-d');
      if(d === 'C'){ state.eingabe_wert = ''; }
      else if(d === 'back'){ state.eingabe_wert = state.eingabe_wert.slice(0,-1); }
      else if(d === 'ok'){
        var val = parseInt(state.eingabe_wert||'0');
        hideModal();
        callback(val);
        return;
      }
      else { 
        var neu = state.eingabe_wert + d;
        if(parseInt(neu) <= state.eingabe_max) state.eingabe_wert = neu;
      }
      disp.textContent = fmtNum(parseInt(state.eingabe_wert||'0'));
    });
  });
  disp.textContent = '0';
}

// === Menu selection (for Bild 5, Militär, etc.) ===
function menuSelect(title, items, callback){
  var html = '<div class="c64-modal-title">'+title+'</div>';
  items.forEach(function(item, i){
    html += '<button style="display:block;width:100%;margin:4px 0;font-size:9px" data-idx="'+i+'">'+item.label+'</button>';
  });
  html += '<button style="display:block;width:100%;margin:4px 0;font-size:9px" id="menuCancel">ABBRECHEN</button>';
  showModal(html);
  modalContent.querySelectorAll('button[data-idx]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = parseInt(this.getAttribute('data-idx'));
      hideModal();
      callback(items[idx]);
    });
  });
  document.getElementById('menuCancel').addEventListener('click', hideModal);
}

// === Render based on state ===
function render(){
  if(state.phase === 'login'){ showLogin(); return; }
  if(state.phase === 'lobby'){ showLobby(); return; }
  if(!state.spielstand){ showLogin(); return; }
  
  var sp = state.spielstand;
  var ich = sp.spieler[sp.aktiver_spieler_idx];
  var istMeinZug = (ich && ich.name === state.mein_name);
  
  if(sp.spiel_beendet){
    showKroenung(sp);
    return;
  }
  
  if(!istMeinZug){
    showWaiting(sp);
    return;
  }
  
  // Mein Zug - zeige aktuellen Bild-Schritt
  switch(state.bildStep){
    case 0: showBild1Handel(sp, ich); break;
    case 1: showBild1KornAusgabe(sp, ich); break;
    case 2: showBild2Statistik(sp, ich); break;
    case 3: showBild3Steuern(sp, ich); break;
    case 4: showBild4Karte(sp, ich); break;
    case 5: showBild5Ausgaben(sp, ich); break;
    default: state.bildStep = 0; showBild1Handel(sp, ich);
  }
}

// === Waiting screen ===
function showWaiting(sp){
  var aktiv = sp.spieler[sp.aktiver_spieler_idx];
  clearScreen('blue');

// === Militär submenu ===

  print(4,6,'Infanterie: '+s.truppen.infanterie,'white','blue');
  print(4,7,'Miliz:      '+s.miliz,'light-grey','blue');
  print(4,8,'Kampfwert:  '+s.truppen_kampfwert+'/100','light-green','blue');
  
  hLine(0,10,40,'-','light-blue','blue');
  print(2,11,'KAVALLERIE  50/T','white','blue');
  print(2,12,'ARTILLERIE  80/T','white','blue');
  print(2,13,'INFANTERIE  30/T','white','blue');
  print(2,14,'MANOEVER','light-green','blue');
  print(2,15,'KRIEG FUEHREN','light-red','blue');
  
  infoEl.textContent = 'MILITAER | Truppen rekrutieren, Manöver, Krieg';
  
  navEl.innerHTML = 
    '<button id="bKav">KAVALL</button>'+
    '<button id="bArt">ARTILL</button>'+
    '<button id="bInf">INFANT</button>'+
    '<button id="bMano">MANOEV</button>'+
    '<button id="bKrieg">KRIEG</button>'+
    '<button id="bZurueck">ZURUECK</button>';
  
  document.getElementById('bKav').addEventListener('click', function(){
    numberInput('KAVALLERIE REKRUTIEREN', s.einwohner, function(n){
      doAktion('soldaten_rekrutieren',{typ:'kavallerie',anzahl:n}).then(function(){showMilitaer(state.spielstand, state.spielstand.spieler[state.spielstand.aktiver_spieler_idx])});
    });
  });
  document.getElementById('bArt').addEventListener('click', function(){
    numberInput('ARTILLERIE REKRUTIEREN', s.einwohner, function(n){
      doAktion('soldaten_rekrutieren',{typ:'artillerie',anzahl:n}).then(function(){showMilitaer(state.spielstand, state.spielstand.spieler[state.spielstand.aktiver_spieler_idx])});
    });
  });
  document.getElementById('bInf').addEventListener('click', function(){
    numberInput('INFANTERIE REKRUTIEREN', s.einwohner, function(n){
      doAktion('soldaten_rekrutieren',{typ:'infanterie',anzahl:n}).then(function(){showMilitaer(state.spielstand, state.spielstand.spieler[state.spielstand.aktiver_spieler_idx])});
    });
  });
  document.getElementById('bMano').addEventListener('click', function(){
    doAktion('manoever').then(function(){showMilitaer(state.spielstand, state.spielstand.spieler[state.spielstand.aktiver_spieler_idx])});
  });
  document.getElementById('bKrieg').addEventListener('click', function(){
    var gegner = [];
    sp.spieler.forEach(function(s2, i){
      if(i !== sp.aktiver_spieler_idx && !s2.tot){
        gegner.push({label:s2.name+' ('+s2.staat+')', idx:i});
      }
    });
    if(gegner.length === 0){ infoEl.textContent = 'KEINE GEGNER'; return; }
    menuSelect('KRIEG GEGEN WEN?', gegner, function(item){
      doAktion('krieg_erklaeren',{verteidiger_idx:item.idx}).then(function(res){
        if(res.erfolg){
          // Simplified: auto-resolve war
          doAktion('krieg_durchfuehren',{verteidiger_idx:item.idx}).then(function(res2){
            showKriegErgebnis(res2);
          });
        } else {
          infoEl.textContent = res.fehler;
        }
      });
    });
  });
  document.getElementById('bZurueck').addEventListener('click', function(){
    showBild5Ausgaben(state.spielstand, state.spielstand.spieler[state.spielstand.aktiver_spieler_idx]);
  });
}

function showKriegErgebnis(res){
  clearScreen('black');
  printCenter(2,'KRIEGSERGEBNIS','yellow','black');
  hLine(0,4,40,'=','white','black');
  printCenter(6,res.angreifer+' VS','white','black');
  printCenter(7,res.verteidiger,'white','black');
  hLine(0,9,40,'-','light-blue','black');
  if(res.angreifer_gewinnt){
    printCenter(11,res.angreifer+' GEWINNT!','light-green','black');
    if(res.land_gewinn) printCenter(13,'LANDGEWINN: '+fmtNum(res.land_gewinn)+' Ha','yellow','black');
  } else {
    printCenter(11,res.verteidiger+' GEWINNT!','light-red','black');
    if(res.geld_verlust) printCenter(13,'GELDVERLUST: '+fmtNum(res.geld_verlust),'light-red','black');
  }
  hLine(0,15,40,'-','light-blue','black');
  printCenter(17,'Verluste Angreifer: '+res.angreifer_verluste,'white','black');
  printCenter(18,'Verluste Verteidiger: '+res.verteidiger_verluste,'white','black');
  printCenter(22,'WEITER','light-green','black');
  
  infoEl.textContent = 'KRIEGSERGEBNIS';

  document.getElementById('bWeiterKrieg').addEventListener('click', function(){
    showMilitaer(state.spielstand, state.spielstand.spieler[state.spielstand.aktiver_spieler_idx]);
  });
}
