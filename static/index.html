<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KAISER Online</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="c64renderer.js"></script>
<style>
:root{
  --c64-black:#000;--c64-white:#fff;--c64-red:#813338;--c64-cyan:#75CEC8;
  --c64-purple:#8E3C97;--c64-green:#56AC4D;--c64-blue:#2E2C9B;
  --c64-yellow:#EDF171;--c64-orange:#8E4229;--c64-brown:#553800;
  --c64-light-red:#C46C71;--c64-dark-grey:#4A4A4A;--c64-grey:#808080;
  --c64-light-green:#AAD652;--c64-light-blue:#6C7EEB;--c64-light-grey:#D0D0D0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Press Start 2P',monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}

.c64-border{
  background:var(--c64-light-blue);
  padding:2vmin;border-radius:4px;flex-shrink:1;
  display:flex;flex-direction:column;
  max-width:100vw;max-height:100vh;
}
/* Canvas fills available space, keeps 320:200 = 1.6:1 aspect ratio */
.c64-canvas-wrap{
  position:relative;
  width:min(96vw,calc((88vh - 80px) * 1.6));
  aspect-ratio:320/200;
}
#c64canvas{
  width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;
  display:block;
  cursor:pointer;
}

.c64-info{color:var(--c64-light-grey);font-size:calc(min(1.0vw,0.9vh));
  text-align:center;margin-top:6px;font-family:'Press Start 2P',monospace;padding:4px}

.c64-modal{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;
  z-index:10;
}
.c64-modal-inner{
  background:var(--c64-blue);border:2px solid var(--c64-light-blue);
  padding:16px;border-radius:4px;max-width:90%;max-height:90%;overflow:auto;
}
.c64-modal-inner input{
  font-family:'Press Start 2P',monospace;font-size:12px;
  padding:8px;margin:8px 0;width:100%;background:#000;color:var(--c64-light-green);
  border:1px solid var(--c64-light-blue);text-transform:uppercase;letter-spacing:2px;
}
.c64-modal-inner select{
  font-family:'Press Start 2P',monospace;font-size:10px;
  padding:6px;width:100%;background:#000;color:var(--c64-light-green);
  border:1px solid var(--c64-light-blue);
}
.c64-modal-inner button{
  font-family:'Press Start 2P',monospace;font-size:10px;
  background:var(--c64-light-blue);color:var(--c64-blue);
  border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin:4px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.c64-modal-inner button:active{background:var(--c64-white)}
.c64-modal-title{color:var(--c64-yellow);font-size:10px;margin-bottom:10px;text-align:center}
.c64-modal-label{color:var(--c64-cyan);font-size:8px;margin-top:8px}

.c64-keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}
.c64-keypad button{
  font-family:'Press Start 2P',monospace;font-size:10px;
  background:var(--c64-dark-grey);color:var(--c64-light-green);
  border:1px solid var(--c64-light-blue);padding:10px 4px;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.c64-keypad button:active{background:var(--c64-light-blue);color:var(--c64-blue)}
.c64-keypad-wide{grid-column:span 2}

.c64-nav{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.c64-nav button{
  font-family:'Press Start 2P',monospace;font-size:calc(min(1.1vw,0.9vh));
  background:var(--c64-light-blue);color:var(--c64-blue);border:none;
  padding:8px 12px;border-radius:4px;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.c64-nav button:active{background:var(--c64-white)}
.c64-nav button:disabled{background:var(--c64-dark-grey);color:var(--c64-grey)}
</style>
</head>
<body>

<div class="c64-border">
  <div class="c64-canvas-wrap">
    <canvas id="c64canvas"></canvas>
    <div class="c64-modal" id="modal">
      <div class="c64-modal-inner" id="modalContent"></div>
    </div>
  </div>
  <div class="c64-info" id="info">KAISER ONLINE</div>
  <div class="c64-nav" id="nav"></div>
</div>

<script>
(function(){
'use strict';

// === Config ===
var API = '';
if (location.hostname === 'falkkrueger.github.io' || location.protocol === 'file:') {
  API = window.KAISER_API_URL || 'https://star-inclusive-reviews-housing.trycloudflare.com';
}

// === State ===
var state = {
  spiel_id:null, spiel_code:null, mein_name:null, spielstand:null,
  ws:null, phase:'login', bildStep:0, isHost:false,
  eingabe_wert:'', eingabe_max:999999,
};
var urlParams = new URLSearchParams(location.search);
var preCode = urlParams.get('code');
if(preCode) state.preFillCode = preCode.toUpperCase();

// === C64 Renderer ===
var canvas = document.getElementById('c64canvas');
var renderer = new C64Renderer(canvas);
var infoEl = document.getElementById('info');
var navEl = document.getElementById('nav');
var modalEl = document.getElementById('modal');
var modalContent = document.getElementById('modalContent');

// === Screen helpers (using C64Renderer) ===
var C = C64_PALETTE; // color palette array
// Color indices: 0=black 1=white 2=red 3=cyan 4=purple 5=green 6=blue 7=yellow
// 8=orange 9=brown 10=light-red 11=dark-grey 12=grey 13=light-green 14=light-blue 15=light-grey

function clr(bg){
  renderer.regs.bg = bg !== undefined ? bg : 6;
  renderer.clear(32, bg !== undefined ? bg : 6);
}
function poke(col,row,ch,color){
  // ch = screen code (0-255) or PETSCII char
  if(typeof ch === 'string') ch = petToScreen(ch.charCodeAt(0));
  renderer.poke(col, row, ch, color);
}
function petToScreen(c){
  if(c>=65 && c<=90) return c-64; // A-Z -> 1-26
  if(c>=48 && c<=57) return c+48; // 0-9 -> 48-57... actually C64 screen codes: 0=48,1=49...
  if(c===32) return 32;
  if(c===46) return 46; // .
  if(c===33) return 33; // !
  if(c===58) return 58; // :
  if(c===45) return 45; // -
  if(c===43) return 43; // +
  if(c===35) return 35; // #
  if(c===36) return 36; // $
  if(c===37) return 37; // %
  if(c===38) return 38; // &
  if(c===39) return 39; // '
  if(c===40) return 40; // (
  if(c===41) return 41; // )
  if(c===42) return 42; // *
  if(c===47) return 47; // /
  if(c===60) return 60; // <
  if(c===61) return 61; // =
  if(c===62) return 62; // >
  if(c===63) return 63; // ?
  if(c===91) return 91; // [
  if(c===93) return 93; // ]
  if(c===94) return 94; // ^
  if(c>=97 && c<=122) return c-96; // a-z -> 1-26 (same as A-Z in uppercase mode)
  if(c===228) return 91; // ä -> [ position (C64 maps ä to screen code 91)
  if(c===246) return 93; // ö
  if(c===252) return 94; // ü
  if(c===223) return 95; // ß
  return c;
}
function print(col,row,text,color){
  for(var i=0;i<text.length && col+i<40;i++){
    poke(col+i,row,text[i],color);
  }
}
function printCenter(row,text,color){
  var col=Math.floor((40-text.length)/2);
  if(col<0)col=0;
  print(col,row,text,color);
}
function hLine(col,row,len,color){
  for(var i=0;i<len && col+i<40;i++) poke(col+i,row,32,color);
}
function fillRect(col,row,w,h,color){
  for(var r=row;r<row+h && r<25;r++)
    for(var c=col;c<col+w && c<40;c++)
      poke(c,r,32,color);
}
function fmtNum(n){
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}

function showModal(html){ modalContent.innerHTML=html; modalEl.style.display='flex'; }
function hideModal(){ modalEl.style.display='none'; }

function renderScreen(){ renderer.render(); }

// === API ===
function apiCall(path, method, body){
  method = method || 'GET';
  var opts = {method:method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  return fetch(API+path, opts).then(function(r){return r.json()});
}

function connectWS(){
  if(state.ws){ try{state.ws.close();}catch(e){} }
  try {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    state.ws = new WebSocket(proto+'//'+location.host+'/ws/'+state.spiel_id);
    state.ws.onmessage = function(ev){
      try { var msg=JSON.parse(ev.data);
        if(msg.type==='spielstand'){ state.spielstand=msg.data; render(); }
      } catch(e){}
    };
    state.ws.onclose=function(){}; state.ws.onerror=function(){};
  } catch(e){}
}

function doAktion(aktion, parameter){
  return apiCall('/api/spiel/'+state.spiel_id+'/aktion','POST',{aktion:aktion, parameter:parameter||{}})
    .then(function(res){
      return apiCall('/api/spiel/'+state.spiel_id).then(function(stand){
        state.spielstand=stand; return res;
      }).catch(function(){ return res; });
    });
}

// === Number input ===
function numberInput(title, max, callback){
  state.eingabe_wert=''; state.eingabe_max=max||999999;
  showModal(
    '<div class="c64-modal-title">'+title+'</div>'+
    '<div style="text-align:center;font-size:16px;color:var(--c64-light-green);margin:10px 0" id="numDisplay">0</div>'+
    '<div class="c64-keypad">'+
    '<button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button><button data-d="C">C</button><button data-d="back">&lt;</button>'+
    '<button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button><button data-d="0">0</button><button data-d="ok" class="c64-keypad-wide" style="grid-row:span 2">OK</button>'+
    '<button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button><button data-d="00">00</button>'+
    '</div>'
  );
  var disp=document.getElementById('numDisplay');
  modalContent.querySelectorAll('.c64-keypad button').forEach(function(btn){
    btn.addEventListener('click',function(){
      var d=this.getAttribute('data-d');
      if(d==='C'){state.eingabe_wert='';}
      else if(d==='back'){state.eingabe_wert=state.eingabe_wert.slice(0,-1);}
      else if(d==='ok'){var v=parseInt(state.eingabe_wert||'0');hideModal();callback(v);return;}
      else{var n=state.eingabe_wert+d;if(parseInt(n)<=state.eingabe_max)state.eingabe_wert=n;}
      disp.textContent=fmtNum(parseInt(state.eingabe_wert||'0'));
    });
  });
}

function menuSelect(title, items, callback){
  var html='<div class="c64-modal-title">'+title+'</div>';
  items.forEach(function(item,i){
    html+='<button style="display:block;width:100%;margin:4px 0;font-size:9px" data-idx="'+i+'">'+item.label+'</button>';
  });
  html+='<button style="display:block;width:100%;margin:4px 0;font-size:9px" id="menuCancel">ABBRECHEN</button>';
  showModal(html);
  modalContent.querySelectorAll('button[data-idx]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var idx=parseInt(this.getAttribute('data-idx'));
      hideModal();callback(items[idx]);
    });
  });
  document.getElementById('menuCancel').addEventListener('click',hideModal);
}

// === LOGIN ===
function showLogin(){
  renderer.regs.border = 14; // light blue
  renderer.regs.bg = 0; // black
  clr(0);
  printCenter(4,'KAISER',7);
  printCenter(6,'(C) 1984 ARIOLASOFT',2);
  printCenter(10,'ONLINE MULTIPLAYER',3);
  printCenter(20,'TAPPE EINE OPTION',7);
  renderScreen();
  infoEl.textContent='KAISER ONLINE';
  navEl.innerHTML='<button id="btnNew" style="font-size:calc(min(1.6vw,1.4vh));padding:12px 24px">NEUES SPIEL</button><button id="btnJoin" style="font-size:calc(min(1.6vw,1.4vh));padding:12px 24px">SPIEL BEITRETEN</button>';
  document.getElementById('btnNew').addEventListener('click',startNewGame);
  document.getElementById('btnJoin').addEventListener('click',joinGame);
}

function startNewGame(){
  var staaten=['Preussen','Bayern','Hessen','Boehmen','Sachsen','Wuerttemberg','Hannover','Pfalz','Braunschweig'];
  var opts=staaten.map(function(s){return '<option>'+s+'</option>'}).join('');
  showModal(
    '<div class="c64-modal-title">NEUES SPIEL</div>'+
    '<div class="c64-modal-label">DEIN NAME:</div>'+
    '<input type="text" id="inpName" maxlength="10" placeholder="Name" autofocus>'+
    '<div class="c64-modal-label">GESCHLECHT:</div>'+
    '<div style="display:flex;gap:8px"><button id="gM" style="flex:1">M</button><button id="gW" style="flex:1">W</button></div>'+
    '<div class="c64-modal-label">STAAT:</div>'+
    '<select id="inpStaat">'+opts+'</select>'+
    '<div style="text-align:center;margin-top:12px"><button id="btnCreate">SPIEL ERSTELLEN</button><button id="btnCancel">ABBRECHEN</button></div>'
  );
  var g='M';
  document.getElementById('gM').addEventListener('click',function(){g='M';this.style.background='var(--c64-light-blue)';document.getElementById('gW').style.background='var(--c64-dark-grey)'});
  document.getElementById('gW').addEventListener('click',function(){g='W';this.style.background='var(--c64-light-blue)';document.getElementById('gM').style.background='var(--c64-dark-grey)'});
  document.getElementById('gM').style.background='var(--c64-light-blue)';
  document.getElementById('btnCreate').addEventListener('click',function(){
    var name=document.getElementById('inpName').value.trim();
    var staat=document.getElementById('inpStaat').value;
    if(!name)return;
    apiCall('/api/spiel/erstellen','POST',{name:name,geschlecht:g,staat:staat}).then(function(res){
      state.spiel_id=res.spiel_id;state.spiel_code=res.spiel_code;
      state.spielstand=res.spielstand;state.mein_name=name;
      state.phase='lobby';state.isHost=true;hideModal();connectWS();showLobby();
    });
  });
  document.getElementById('btnCancel').addEventListener('click',hideModal);
}

function joinGame(){
  showModal(
    '<div class="c64-modal-title">SPIEL BEITRETEN</div>'+
    '<div class="c64-modal-label">SPIELCODE (6 ZEICHEN):</div>'+
    '<input type="text" id="inpCode" maxlength="6" style="text-transform:uppercase;letter-spacing:4px" placeholder="ABC123" autofocus value="'+(state.preFillCode||'')+'">'+
    '<div class="c64-modal-label">DEIN NAME:</div>'+
    '<input type="text" id="inpName" maxlength="10" placeholder="Name">'+
    '<div class="c64-modal-label">GESCHLECHT:</div>'+
    '<div style="display:flex;gap:8px"><button id="gM2" style="flex:1">M</button><button id="gW2" style="flex:1">W</button></div>'+
    '<div style="text-align:center;margin-top:12px"><button id="btnJoin2">BEITRETEN</button><button id="btnCancel2">ABBRECHEN</button></div>'
  );
  var g='M';
  document.getElementById('gM2').addEventListener('click',function(){g='M';this.style.background='var(--c64-light-blue)';document.getElementById('gW2').style.background='var(--c64-dark-grey)'});
  document.getElementById('gW2').addEventListener('click',function(){g='W';this.style.background='var(--c64-light-blue)';document.getElementById('gM2').style.background='var(--c64-dark-grey)'});
  document.getElementById('gM2').style.background='var(--c64-light-blue)';
  document.getElementById('btnJoin2').addEventListener('click',function(){
    var code=document.getElementById('inpCode').value.toUpperCase();
    var name=document.getElementById('inpName').value.trim();
    if(!code||code.length<6||!name)return;
    apiCall('/api/spiel/code/'+code).then(function(res){
      var sid=res.spiel_id;
      return apiCall('/api/spiel/'+sid+'/beitreten','POST',{name:name,geschlecht:g}).then(function(r){
        state.spiel_id=sid;state.spiel_code=code;state.spielstand=r.spielstand;
        state.mein_name=name;state.isHost=false;hideModal();connectWS();
        if(r.spielstand.phase==='setup'||r.spielstand.phase==='lobby'){
          state.phase='lobby';showLobby();
        }else{
          state.phase='playing';render();
        }
      });
    }).catch(function(){
      showModal('<div class="c64-modal-title">FEHLER</div><div style="color:var(--c64-light-red);font-size:8px">SPIEL NICHT GEFUNDEN</div><button onclick="hideModal()">OK</button>');
    });
  });
  document.getElementById('btnCancel2').addEventListener('click',hideModal);
}

// === LOBBY ===
var lobbyPollTimer=null;
function showLobby(){
  var sp=state.spielstand;if(!sp){showLogin();return;}
  renderer.regs.border=14; renderer.regs.bg=6; clr(6);
  printCenter(0,'KAISER LOBBY',7);
  hLine(0,1,40,1);
  print(2,3,'SPIELCODE:',1);
  print(15,3,state.spiel_code,13);
  print(2,5,'EINLADUNG:',1);
  print(2,6,'falkkrueger.github.io',3);
  print(2,7,'/kaiser-online/?code=',3);
  print(2,8,state.spiel_code,13);
  print(2,10,'SPIELER:',7);
  for(var i=0;i<sp.spieler.length&&i<12;i++){
    var s=sp.spieler[i];
    print(2,11+i,(i+1)+'. '+s.name+' ('+s.staat+')',1);
  }
  printCenter(24,sp.spieler.length+' SPIELER',13);
  renderScreen();
  infoEl.textContent='LOBBY - Code: '+state.spiel_code+' - '+sp.spieler.length+' Spieler';
  if(state.isHost){
    navEl.innerHTML='<button id="btnStart" style="background:var(--c64-green);font-size:calc(min(1.6vw,1.4vh));padding:12px 24px">SPIEL STARTEN</button><button id="btnLink" style="font-size:calc(min(1.4vw,1.2vh));padding:12px 16px">LINK TEILEN</button>';
    document.getElementById('btnStart').addEventListener('click',function(){
      apiCall('/api/spiel/'+state.spiel_id+'/starten','POST',{}).then(function(res){
        state.spielstand=res.spielstand;state.phase='playing';
        if(lobbyPollTimer){clearInterval(lobbyPollTimer);lobbyPollTimer=null;}
        render();
      });
    });
    document.getElementById('btnLink').addEventListener('click',function(){
      var link='https://falkkrueger.github.io/kaiser-online/?code='+state.spiel_code;
      if(navigator.share){navigator.share({title:'Kaiser Online',text:'Komm Kaiser spielen! Code: '+state.spiel_code,url:link});}
      else{navigator.clipboard.writeText(link);infoEl.textContent='LINK KOPIERT!';}
    });
  }else{
    navEl.innerHTML='<button disabled style="opacity:0.5">WARTE AUF START...</button>';
  }
  if(lobbyPollTimer)clearInterval(lobbyPollTimer);
  lobbyPollTimer=setInterval(function(){
    apiCall('/api/spiel/'+state.spiel_id).then(function(stand){
      state.spielstand=stand;
      if(stand.phase!=='setup'){if(lobbyPollTimer){clearInterval(lobbyPollTimer);lobbyPollTimer=null;}state.phase='playing';render();}
      else{showLobby();}
    }).catch(function(){});
  },3000);
}

// === WAITING ===
var waitPollTimer=null;
function showWaiting(sp){
  var aktiv=sp.spieler[sp.aktiver_spieler_idx];
  renderer.regs.border=14; renderer.regs.bg=6; clr(6);
  fillRect(0,0,40,3,0);
  printCenter(0,'KAISER',7);
  printCenter(1,'WARTE AUF ZUG',1);
  printCenter(8,aktiv.name+' IST DRAN',7);
  printCenter(10,(aktiv.titel||'')+' VON '+aktiv.staat,13);
  printCenter(12,'JAHR '+sp.jahr,1);
  printCenter(16,'DU BIST:',11);
  printCenter(18,state.mein_name,3);
  var ich=sp.spieler.find(function(s){return s.name===state.mein_name});
  if(ich){
    printCenter(20,ich.titel||'(KEIN TITEL)',13);
    printCenter(22,'GELD: '+fmtNum(ich.geld),7);
  }
  printCenter(24,'WARTEN...',10);
  renderScreen();
  infoEl.textContent='Warte auf '+aktiv.name+' - Seite offen lassen!';
  navEl.innerHTML='';
  if(waitPollTimer)clearInterval(waitPollTimer);
  waitPollTimer=setInterval(function(){
    apiCall('/api/spiel/'+state.spiel_id).then(function(stand){
      state.spielstand=stand;
      var dran=stand.spieler[stand.aktiver_spieler_idx]&&stand.spieler[stand.aktiver_spieler_idx].name===state.mein_name;
      if(dran){if(waitPollTimer){clearInterval(waitPollTimer);waitPollTimer=null;}state.bildStep=0;render();}
    }).catch(function(){});
  },3000);
}

// === BILD 1: HANDEL ===
function showBild1Handel(sp,s){
  renderer.regs.border=14; renderer.regs.bg=6; clr(6);
  fillRect(0,0,40,3,0);
  printCenter(0,'KAISER',7);
  print(2,1,(s.titel||'')+' '+s.name,1);
  print(2,2,'WETTER: '+sp.wetter.toUpperCase(),13);
  print(22,1,'KORNPREIS:'+fmtNum(sp.kornpreis),7);
  print(22,2,'LANDPREIS: '+fmtNum(sp.landpreis),7);
  // Kornspeicher (visual silo using custom chars)
  print(2,4,'KORNSPEICHER',1);
  // Draw silo box using C64 line characters
  var si=6; // silo level in rows
  var fillLevel=Math.min(si,Math.floor(s.korn/3000));
  for(var r=5;r<13;r++){
    poke(2,r,108,1); // left border
    poke(11,r,108,1); // right border (use | char)
  }
  poke(2,4,109,1); poke(11,4,109,1); // top corners
  poke(2,13,109,1); poke(11,13,109,1); // bottom corners
  for(var c=3;c<11;c++) poke(c,4,67,1); // top line
  for(var c=3;c<11;c++) poke(c,13,67,1); // bottom line
  // Fill silo
  for(var r=12;r>=13-fillLevel;r--){
    for(var c=3;c<11;c++) poke(c,r,160,7); // filled = yellow block char
  }

// === BILD 1b: KORNAUSGABE ===

// === BILD 2: STATISTIK ===

// === MILITAER ===
function showMilitaer(sp,s){
  renderer.regs.border=14; renderer.regs.bg=6; clr(6);
  fillRect(0,0,40,2,0);
  printCenter(0,'MILITAER',7);
  print(2,1,s.name+' - GELD: '+fmtNum(s.geld),1);
  print(2,3,'TRUPPEN:',7);
  print(4,4,'Kavallerie: '+s.truppen.kavallerie,1);
  print(4,5,'Artillerie: '+s.truppen.artillerie,1);
  print(4,6,'Infanterie: '+s.truppen.infanterie,1);
  print(4,7,'Miliz:      '+s.miliz,11);
  print(4,8,'Kampfwert:  '+s.truppen_kampfwert+'/100',13);
  hLine(0,10,40,11);
  print(2,11,'KAVALLERIE  50/T',1);
  print(2,12,'ARTILLERIE  80/T',1);
  print(2,13,'INFANTERIE  30/T',1);
  print(2,14,'MANOEVER',13);
  print(2,15,'KRIEG FUEHREN',2);
  renderScreen();
  infoEl.textContent='MILITAER | Rekrutieren, Manoever, Krieg';
  navEl.innerHTML='<button id="bKav">KAVALL</button><button id="bArt">ARTILL</button><button id="bInf">INFANT</button><button id="bMano">MANOEV</button><button id="bKrieg">KRIEG</button><button id="bZurueck">ZURUECK</button>';
  document.getElementById('bKav').addEventListener('click',function(){numberInput('KAVALLERIE',s.einwohner,function(n){doAktion('soldaten_rekrutieren',{typ:'kavallerie',anzahl:n}).then(function(){showMilitaer(state.spielstand,state.spielstand.spieler[state.spielstand.aktiver_spieler_idx]);});});});
  document.getElementById('bArt').addEventListener('click',function(){numberInput('ARTILLERIE',s.einwohner,function(n){doAktion('soldaten_rekrutieren',{typ:'artillerie',anzahl:n}).then(function(){showMilitaer(state.spielstand,state.spielstand.spieler[state.spielstand.aktiver_spieler_idx]);});});});
  document.getElementById('bInf').addEventListener('click',function(){numberInput('INFANTERIE',s.einwohner,function(n){doAktion('soldaten_rekrutieren',{typ:'infanterie',anzahl:n}).then(function(){showMilitaer(state.spielstand,state.spielstand.spieler[state.spielstand.aktiver_spieler_idx]);});});});
  document.getElementById('bMano').addEventListener('click',function(){doAktion('manoever').then(function(){showMilitaer(state.spielstand,state.spielstand.spieler[state.spielstand.aktiver_spieler_idx]);});});
  document.getElementById('bKrieg').addEventListener('click',function(){
    var gegner=[]; sp.spieler.forEach(function(s2,i){
      if(i!==sp.aktiver_spieler_idx&&!s2.tot) gegner.push({label:s2.name+' ('+s2.staat+')',idx:i});
    });
    if(!gegner.length){infoEl.textContent='KEINE GEGNER';return;}
    menuSelect('KRIEG GEGEN WEN?',gegner,function(item){
      doAktion('krieg_erklaeren',{verteidiger_idx:item.idx}).then(function(res){
        if(res.erfolg){doAktion('krieg_durchfuehren',{verteidiger_idx:item.idx}).then(showKriegErgebnis);}
        else infoEl.textContent=res.fehler;
      });
    });
  });
  document.getElementById('bZurueck').addEventListener('click',function(){showBild5Ausgaben(state.spielstand,state.spielstand.spieler[state.spielstand.aktiver_spieler_idx]);});
}

function showKriegErgebnis(res){
  renderer.regs.border=0; renderer.regs.bg=0; clr(0);
  printCenter(2,'KRIEGSERGEBNIS',7);
  printCenter(6,res.angreifer+' VS',1);
  printCenter(7,res.verteidiger,1);
  if(res.angreifer_gewinnt){
    printCenter(11,res.angreifer+' GEWINNT!',13);
    if(res.land_gewinn) printCenter(13,'LANDGEWINN: '+fmtNum(res.land_gewinn)+' Ha',7);
  }else{
    printCenter(11,res.verteidiger+' GEWINNT!',10);
    if(res.geld_verlust) printCenter(13,'GELDVERLUST: '+fmtNum(res.geld_verlust),10);
  }
  printCenter(17,'Verluste A: '+res.angreifer_verluste,1);
  printCenter(18,'Verluste V: '+res.verteidiger_verluste,1);
  printCenter(22,'WEITER',13);
  renderScreen();
  infoEl.textContent='KRIEGSERGEBNIS';
  navEl.innerHTML='<button id="bWK">WEITER &gt;</button>';
  document.getElementById('bWK').addEventListener('click',function(){showMilitaer(state.spielstand,state.spielstand.spieler[state.spielstand.aktiver_spieler_idx]);});
}

  var s=sp.spieler[sp.aktiver_spieler_idx];

  printCenter(5,'IHNEN WIRD EIN NEUER',1);
  printCenter(6,'TITEL VERLIEHEN !',1);
  printCenter(8,'SIE SIND NUN',1);
  printCenter(10,bef.titel.toUpperCase()+' '+s.name,7);
  printCenter(11,'VON '+s.staat.toUpperCase()+' !',7);
  renderScreen();
  infoEl.textContent='BEFOERDERUNG! '+bef.titel;

// === KROENUNG ===
function showKroenung(sp){
  renderer.regs.border=7; renderer.regs.bg=7; clr(7);
  fillRect(2,2,36,18,5);
  printCenter(4,'*** KROENUNG ***',7);
  printCenter(7,'LANG LEBE',1);
  var k=sp.spieler[sp.kaiser_spieler_idx];
  printCenter(9,'KAISER '+k.name,7);
  printCenter(10,'VON '+k.staat,7);
  printCenter(16,'DAS SPIEL IST VORBEI',10);
  renderScreen();
  infoEl.textContent='SPIELENDE - Kaiser '+k.name;
  navEl.innerHTML='<button id="bNeu">NEUES SPIEL</button>';
  document.getElementById('bNeu').addEventListener('click',function(){
    state.phase='login';state.spielstand=null;state.spiel_id=null;showLogin();
  });
}

// === RENDER DISPATCH ===
function render(){
  if(state.phase==='login'){showLogin();return;}
  if(state.phase==='lobby'){showLobby();return;}
  if(!state.spielstand){showLogin();return;}
  var sp=state.spielstand;
  var ich=sp.spieler[sp.aktiver_spieler_idx];
  var istMeinZug=(ich&&ich.name===state.mein_name);
  if(sp.spiel_beendet){showKroenung(sp);return;}
  if(!istMeinZug){showWaiting(sp);return;}
  switch(state.bildStep){
    case 0: showBild1Handel(sp,ich);break;
    case 1: showBild1KornAusgabe(sp,ich);break;
    case 2: showBild2Statistik(sp,ich);break;
    case 3: showBild3Steuern(sp,ich);break;
    case 5: showBild5Ausgaben(sp,ich);break;
    default: state.bildStep=0; showBild1Handel(sp,ich);
  }
}

// === START ===
if(state.preFillCode){
  joinGame();
  setTimeout(function(){var inp=document.getElementById('inpCode');if(inp)inp.value=state.preFillCode;},100);
}else{
  showLogin();
}

})();
</script>
